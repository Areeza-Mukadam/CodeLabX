spring:
  application:
    name: CodeLabX
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${SERVER_PORT:8080}

codelabx:
  jwt:
    secret: ${JWT_SECRET:codelabx-dev-only-change-this-secret-key!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  execution:
    provider: ${CODE_EXECUTION_PROVIDER:piston}
    timeout-ms: ${CODE_EXECUTION_TIMEOUT_MS:12000}
    piston:
      url: ${PISTON_API_URL:http://127.0.0.1:2000/api/v2/execute}
      authorization: ${PISTON_AUTHORIZATION:}
      java-version: ${PISTON_JAVA_VERSION:17.x}
      python-version: ${PISTON_PYTHON_VERSION:3.x}
    judge0:
      url: ${JUDGE0_API_URL:}
      api-key: ${JUDGE0_API_KEY:}
      api-host: ${JUDGE0_API_HOST:}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:codelabx}
    username: ${POSTGRES_USER:codelabx}
    password: ${POSTGRES_PASSWORD:codelabx-local}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
