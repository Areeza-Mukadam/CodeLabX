spring:
  application:
    name: CodeLabX
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${SERVER_PORT:8080}

codelabx:
  jwt:
    secret: ${JWT_SECRET:codelabx-dev-only-change-this-secret-key!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  execution:
    provider: ${CODE_EXECUTION_PROVIDER:piston}
    timeout-ms: ${CODE_EXECUTION_TIMEOUT_MS:12000}
    piston:
      url: ${PISTON_API_URL:https://emkc.org/api/v2/piston/execute}
      java-version: ${PISTON_JAVA_VERSION:15.0.2}
      python-version: ${PISTON_PYTHON_VERSION:3.10.0}
    judge0:
      url: ${JUDGE0_API_URL:}
      api-key: ${JUDGE0_API_KEY:}
      api-host: ${JUDGE0_API_HOST:}

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:file:./data/codelabx;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:codelabx}
    username: ${POSTGRES_USER:codelabx}
    password: ${POSTGRES_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
