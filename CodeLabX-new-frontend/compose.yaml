services:
  piston:
    image: ghcr.io/engineer-man/piston
    container_name: codelabx-piston
    restart: unless-stopped
    privileged: true
    ports:
      - "127.0.0.1:2000:2000"
    volumes:
      - codelabx-piston-packages:/piston/packages
    tmpfs:
      - /tmp:exec

  postgres:
    image: postgres:17-alpine
    container_name: codelabx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codelabx}
      POSTGRES_USER: ${POSTGRES_USER:-codelabx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codelabx-local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - codelabx-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  codelabx-piston-packages:
  codelabx-postgres-data:
