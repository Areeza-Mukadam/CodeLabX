services:
  # ==============================================================================
  # 1. PostgreSQL Database Service
  # ==============================================================================
  postgres:
    image: postgres:17-alpine
    container_name: codelabx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codelabx}
      POSTGRES_USER: ${POSTGRES_USER:-codelabx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codelabx-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - codelabx-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-codelabx} -d $${POSTGRES_DB:-codelabx}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ==============================================================================
  # 2. Piston Code Execution Engine
  # ==============================================================================
  piston:
    image: ghcr.io/engineer-man/piston
    container_name: codelabx-piston
    restart: unless-stopped
    privileged: true
    environment:
      PISTON_RUN_TIMEOUT: ${PISTON_RUN_TIMEOUT:-12000}
    ports:
      - "127.0.0.1:${PISTON_PORT:-2000}:2000"
    volumes:
      - codelabx-piston-packages:/piston/packages
    tmpfs:
      - /tmp:exec
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:2000/api/v2/packages', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ==============================================================================
  # Reliable Piston Initialization Step (installs and verifies language runtimes)
  # ==============================================================================
  piston-init:
    image: curlimages/curl:latest
    container_name: codelabx-piston-init
    restart: "no"
    depends_on:
      piston:
        condition: service_healthy
    environment:
      PISTON_JAVA_VERSION: ${PISTON_JAVA_VERSION:-15.0.2}
      PISTON_PYTHON_VERSION: ${PISTON_PYTHON_VERSION:-3.12.0}
      PISTON_SQL_VERSION: ${PISTON_SQL_VERSION:-3.41.2}
      PISTON_ASSEMBLY_VERSION: ${PISTON_ASSEMBLY_VERSION:-2.15.5}
    command: >
      sh -c '
        set -e;
        echo "==> [Piston-Init] Waiting for Piston API readiness...";
        until curl -s -f http://piston:2000/api/v2/packages > /dev/null 2>&1; do
          sleep 1;
        done;
        echo "==> [Piston-Init] Installing language runtimes...";
        for spec in "python:$${PISTON_PYTHON_VERSION}" "java:$${PISTON_JAVA_VERSION}" "sqlite3:$${PISTON_SQL_VERSION}" "nasm64:$${PISTON_ASSEMBLY_VERSION}"; do
          LANGUAGE=$${spec%%:*};
          VERSION=$${spec#*:};
          if curl -fsS http://piston:2000/api/v2/packages | grep -Fq "\"language\":\"$${LANGUAGE}\",\"language_version\":\"$${VERSION}\",\"installed\":true"; then
            echo "$${LANGUAGE} $${VERSION} is already installed.";
          else
            echo "Installing $${LANGUAGE} $${VERSION}...";
            curl -fsS -X POST http://piston:2000/api/v2/packages \
            -H "Content-Type: application/json" \
            -d "{\"language\":\"$${LANGUAGE}\",\"version\":\"$${VERSION}\"}";
          fi;
        done;
        echo "==> [Piston-Init] Verifying installed packages in Piston...";
        curl -fsS http://piston:2000/api/v2/packages | grep -E "\"language\":\"(java|python|sqlite3|nasm64)\"";
        echo "==> [Piston-Init] Language runtimes verified and ready."
      '

  # ==============================================================================
  # 3. Spring Boot Backend Service
  # ==============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codelabx-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      piston:
        condition: service_healthy
      piston-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-codelabx}
      POSTGRES_USER: ${POSTGRES_USER:-codelabx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codelabx-local}
      PISTON_API_URL: ${PISTON_API_URL:-http://piston:2000/api/v2/execute}
      PISTON_AUTHORIZATION: ${PISTON_AUTHORIZATION:-}
      PISTON_JAVA_VERSION: ${PISTON_JAVA_VERSION:-15.0.2}
      PISTON_PYTHON_VERSION: ${PISTON_PYTHON_VERSION:-3.12.0}
      JWT_SECRET: ${JWT_SECRET:-codelabx-dev-only-change-this-secret-key-at-least-32-chars!}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CODE_EXECUTION_PROVIDER: ${CODE_EXECUTION_PROVIDER:-piston}
      CODE_EXECUTION_TIMEOUT_MS: ${CODE_EXECUTION_TIMEOUT_MS:-12000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==============================================================================
  # 4. React Frontend Service
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_ENABLE_MOCK_DATA: ${VITE_ENABLE_MOCK_DATA:-false}
    container_name: codelabx-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

# ==============================================================================
# Persistent Storage Volumes
# ==============================================================================
volumes:
  codelabx-postgres-data:
    name: codelabx-postgres-data
  codelabx-piston-packages:
    name: codelabx-piston-packages
